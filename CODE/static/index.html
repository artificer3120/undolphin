<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>unDolphin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1013; --panel:#16191C; --sub:#111417; --pop:#14181C; --line:#262b30; --hair:#1c2025;
    --text:#EDEFF1; --muted:#8b919a; --faint:#5f6671; --bar:#000; --accent:#b81414; --accentLite:#f26d6d;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Archivo',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:#2a3038;}
  a{color:inherit;}
  input,textarea,button{font-family:inherit;color:var(--text);}
  .bar{display:flex;align-items:center;gap:16px;background:var(--bar);padding:12px 18px;border-bottom:1px solid var(--hair);}
  .logo{width:24px;height:24px;border:1.5px solid #EDEFF1;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px;position:relative;}
  .logo::after{content:'';position:absolute;top:-2px;left:-2px;width:6px;height:6px;background:var(--accent);}
  .brand{font-weight:800;font-size:15px;} .brand span{color:var(--accentLite);}
  .wrap{display:flex;align-items:stretch;min-height:calc(100vh - 49px);}
  .rail{width:300px;flex:none;border-right:1px solid var(--line);background:var(--panel);padding:16px;overflow-y:auto;max-height:calc(100vh - 49px);}
  .main{flex:1;min-width:0;padding:16px 18px;overflow-y:auto;max-height:calc(100vh - 49px);
    background-image:radial-gradient(circle, var(--hair) 0.9px, transparent 0.9px);background-size:17px 17px;}
  .lbl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;color:var(--muted);margin:14px 0 8px;text-transform:uppercase;}
  select,.field{width:100%;border:1px solid var(--line);background:var(--sub);color:var(--text);padding:10px 11px;font-size:13px;outline:none;}
  textarea{width:100%;resize:vertical;border:1.5px solid var(--accent);background:var(--sub);color:var(--text);font-size:12.5px;line-height:1.5;padding:10px;outline:none;}
  .chip{cursor:pointer;padding:6px 10px;font-family:'JetBrains Mono',monospace;font-size:9.5px;border:1px solid var(--line);background:transparent;color:var(--text);}
  .chip.on{border-color:var(--accent);background:rgba(184,20,20,.2);color:var(--accentLite);}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
  input[type=range]{width:100%;accent-color:var(--accent);}
  .btn{cursor:pointer;text-align:center;padding:11px 0;font-size:12px;font-weight:700;border:none;}
  .btn.ghost{border:1px solid var(--line);background:var(--sub);color:var(--text);font-weight:600;}
  .btn.gen{background:var(--accent);color:#fff;}
  .btn.gen:disabled{background:#5a1414;cursor:default;}
  .grid{display:flex;gap:12px;align-items:flex-start;}
  .col{flex:1;min-width:0;}
  .cell{margin-bottom:12px;}
  .tile{position:relative;border:1px solid var(--line);overflow:hidden;cursor:pointer;background:var(--sub);}
  .tile img{width:100%;height:auto;display:block;}
  .tile.ph{padding-bottom:100%;}
  .tile .spin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .tile .spin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .spin div{width:26px;height:26px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .cfg{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:8px 9px;margin-bottom:6px;}
  .cfg .t{flex:1;min-width:0;cursor:pointer;overflow:hidden;}
  .cfg .t b{font-size:11.5px;} .cfg .t div{font-size:8px;color:var(--muted);}
  .x{cursor:pointer;color:var(--faint);font-size:14px;}
  .cost{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);margin-top:11px;text-align:center;}
  .cost b{color:var(--accentLite);}
  .err{color:#ffb4ab;background:#2d1215;border:1px solid #f85149;padding:8px 10px;font-size:11px;margin-top:10px;white-space:pre-wrap;}
  .refbadge{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.08em;padding:2px 6px;border:1px solid var(--line);color:var(--muted);}
  .refbadge.req{border-color:var(--accent);color:var(--accentLite);}
  .drop{position:relative;width:100%;height:96px;border:1px dashed var(--line);background:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s,background .15s;overflow:hidden;}
  .drop.over{border-color:var(--accent);background:rgba(184,20,20,.08);}
  .drop.req{border-color:var(--accent);}
  .drop .ph{font-size:10.5px;color:var(--faint);pointer-events:none;transition:color .15s;}
  .drop.over .ph{color:var(--accentLite);}
  .drop img{width:100%;height:100%;object-fit:cover;animation:refin .18s ease-out;}
  @keyframes refin{from{opacity:0;transform:scale(1.04);}to{opacity:1;transform:scale(1);}}
  .drop .clr{position:absolute;top:4px;right:6px;z-index:2;color:#fff;background:rgba(0,0,0,.55);width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;}
  .drop .meta{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);font-family:'JetBrains Mono',monospace;font-size:8px;color:#cfd4da;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .textonly{display:flex;align-items:center;gap:8px;border:1px dashed var(--line);background:var(--sub);padding:11px 12px;font-size:11px;color:var(--muted);line-height:1.45;}
  .vtab{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;padding:7px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;}
  .vtab.on{color:var(--text);border-bottom-color:var(--accent);}
  .tile:hover img{filter:brightness(1.08);}
  .tile:hover{border-color:var(--silver,#AEB4BC);}
  .tile .acts{position:absolute;top:6px;right:6px;display:flex;gap:4px;opacity:0;transition:opacity .12s;z-index:3;}
  .tile:hover .acts{opacity:1;}
  .tile .abtn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);color:var(--text);font-size:13px;cursor:pointer;border:1px solid var(--line);}
  .tile .abtn:hover{border-color:var(--accentLite);color:var(--accentLite);}
  .tile .selbox{position:absolute;top:6px;left:6px;width:18px;height:18px;border:1.5px solid rgba(255,255,255,.75);background:rgba(0,0,0,.5);cursor:pointer;opacity:0;transition:opacity .12s;z-index:3;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;}
  .tile:hover .selbox,.tile.selected .selbox{opacity:1;}
  .tile.selected{outline:2px solid var(--accent);outline-offset:-2px;}
  .tile.selected .selbox{background:var(--accent);border-color:var(--accent);}
  .meta{background:var(--pop);border:1px solid var(--line);border-top:none;padding:6px 8px;font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;white-space:nowrap;overflow:hidden;}
  .selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:70;background:var(--panel);border:1px solid var(--accent);display:none;align-items:center;gap:14px;padding:9px 16px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;}
  .selbar span{cursor:pointer;} .selbar span:hover{color:var(--accentLite);}
  .gwrap{display:none;min-height:calc(100vh - 49px);}
  .gmain{display:flex;align-items:stretch;}
  .gcol{flex:1;min-width:0;padding:16px 18px;overflow-y:auto;max-height:calc(100vh - 49px);
    background-image:radial-gradient(circle, var(--hair) 0.9px, transparent 0.9px);background-size:17px 17px;}
  .drawer{width:300px;flex:none;background:var(--panel);border-left:1px solid var(--line);padding:16px;overflow-y:auto;max-height:calc(100vh - 49px);display:none;}
  .gsearch{width:100%;border:1px solid var(--line);background:var(--sub);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;padding:9px 11px;outline:none;}
  .tagchip{display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:9.5px;padding:4px 8px;border:1px solid var(--line);color:var(--text);cursor:pointer;margin:0 6px 6px 0;}
  .tagchip.on{border-color:var(--accent);background:rgba(184,20,20,.2);color:var(--accentLite);}
  .tagchip .x{color:var(--faint);}
  .tagadd{border:1px solid var(--line);background:var(--sub);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:10px;padding:6px 8px;outline:none;width:110px;}
  .modal{position:fixed;inset:0;z-index:60;background:rgba(6,8,10,.66);display:flex;align-items:center;justify-content:center;padding:28px;}
  .card{max-width:820px;max-height:88vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);display:flex;}
  .card img{width:420px;flex:none;object-fit:contain;background:var(--sub);}
  .card .body{padding:20px;min-width:0;flex:1;}
  .drow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--hair);font-size:11px;}
  .drow span:first-child{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.06em;color:var(--muted);}
  .hd{font-size:12.5px;} .hd b{}
</style>
</head>
<body>
<div class="bar">
  <div class="logo">UD</div>
  <div class="brand">un<span>Dolphin</span></div>
  <div style="display:flex;gap:2px;margin-left:22px">
    <div class="vtab on" id="tabSession" onclick="setView('session')">SESSION</div>
    <div class="vtab" id="tabGallery" onclick="setView('gallery')">GALLERY</div>
  </div>
  <div class="vtab" id="metaToggle" style="margin-left:8px" onclick="toggleMeta()">META</div>
  <div style="flex:1"></div>
  <div class="mono" style="font-size:10px;color:var(--muted);margin-right:14px" id="balance"></div>
  <div class="mono" style="font-size:11.5px" id="topcost">$0.00</div>
</div>

<div class="wrap">
  <div class="rail">
    <div class="lbl">Model</div>
    <select class="field" id="model"></select>
    <div class="mono" id="modelnote" style="font-size:8.5px;color:var(--muted);margin-top:5px"></div>

    <div class="lbl">Catalog <span class="mono" style="font-size:8px;color:var(--faint)">FULL RUNWARE LIBRARY</span></div>
    <input class="gsearch" id="catq" placeholder="Search every model…">
    <div id="catres" style="max-height:180px;overflow-y:auto"></div>

    <div class="lbl">Prompt</div>
    <textarea id="prompt" rows="4" placeholder="Describe your image…">a lone traveller in a ruined stone courtyard, dawn light, cinematic, volumetric fog</textarea>
    <div class="row" style="margin-top:9px">
      <label style="font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px;cursor:pointer">
        <input type="checkbox" id="negon" style="accent-color:var(--accent)"> Negative prompt</label>
    </div>
    <textarea id="negative" rows="2" placeholder="What to avoid…" style="display:none;margin-top:8px;border-width:1px;border-color:var(--line)"></textarea>

    <div id="refsec">
      <div class="lbl" style="display:flex;align-items:center;gap:7px">Reference image <span class="refbadge" id="refbadge" style="display:none"></span></div>
      <div id="refzone"></div>
      <div id="refpaste" style="display:flex;gap:6px;margin-top:8px">
        <input class="mono" id="refurl" placeholder="Paste URL / UUID / Data URI" style="flex:1;min-width:0;border:1px solid var(--line);background:var(--sub);color:var(--text);font-size:10px;padding:8px 9px;outline:none">
        <div class="btn ghost" id="refadd" style="padding:8px 12px">↵</div>
      </div>
      <div id="refhint" style="font-size:10px;color:var(--muted);line-height:1.5;margin-top:7px"></div>
      <input type="file" id="reffile" accept="image/*" style="display:none">
    </div>

    <div class="lbl">Size</div>
    <div id="sizes" style="display:flex;gap:4px;flex-wrap:wrap"></div>

    <div class="row"><span style="font-size:11.5px;color:var(--muted)">Steps</span><span class="mono" id="stepsv" style="font-size:11px;color:var(--muted)"></span></div>
    <input type="range" id="steps" min="1" max="50" value="28">
    <div class="row"><span style="font-size:11.5px;color:var(--muted)">Images</span><span class="mono" id="numv" style="font-size:11px"></span></div>
    <input type="range" id="num" min="1" max="8" value="2">

    <div style="display:flex;gap:9px;margin-top:18px">
      <button class="btn ghost" id="save" style="flex:1">Save</button>
      <button class="btn gen" id="gen" style="flex:1.35">Generate ↵</button>
    </div>
    <div class="cost" id="cost"></div>
    <div id="err"></div>

    <div id="cfgwrap" style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:none">
      <div class="lbl" style="margin-top:0">Saved configs</div>
      <div id="cfgs"></div>
    </div>
  </div>

  <div class="main">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <span class="hd">Model: <b id="mname"></b> · <span class="mono" style="color:var(--accentLite)" id="mcost"></span></span>
      <div style="flex:1"></div>
      <span class="mono" style="font-size:9px;letter-spacing:.1em;color:var(--muted)" id="status"></span>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="gwrap" id="galleryView">
  <div class="gmain">
    <div class="gcol">
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">
        <input class="gsearch" id="gq" placeholder="Search prompts, tags, models…" style="max-width:420px">
        <span class="mono" style="font-size:9px;letter-spacing:.1em;color:var(--muted)" id="gcount"></span>
      </div>
      <div id="gauthors" style="margin-bottom:6px"></div>
      <div id="gchips" style="margin-bottom:10px"></div>
      <div class="grid" id="ggrid"></div>
    </div>
    <div class="drawer" id="drawer"></div>
  </div>
</div>

<div class="selbar" id="selbar">
  <b id="selcount"></b>
  <span onclick="selDownload()">DOWNLOAD</span>
  <span id="seldel" onclick="selDelete()">DELETE</span>
  <span onclick="selClear()">CLEAR</span>
</div>

<div id="modalRoot"></div>

<script>
let MODELS=[], MODEL={}, SIZE='1:1', CONFIGS=[], RESULTS=[], REF=null;
const $=id=>document.getElementById(id);
const DIMS={'1:1':[1024,1024],'16:9':[1344,768],'9:16':[768,1344],'3:2':[1216,832],'2:3':[832,1216],'4:3':[1152,896]};

async function boot(){
  MODELS=await (await fetch('/api/models')).json();
  const sel=$('model'); sel.innerHTML=MODELS.map(m=>`<option value="${m.id}">${m.name} · ${m.tag}</option>`).join('');
  sel.onchange=()=>pickModel(sel.value);
  pickModel(MODELS[0].id);
  CONFIGS=await (await fetch('/api/configs')).json(); renderConfigs();
  RESULTS=await (await fetch('/api/session')).json(); renderGrid();
  wire(); wireCatalog(); refreshBalance();
}
function pickModel(id){
  MODEL=MODELS.find(m=>m.id===id)||MODELS[0];
  $('modelnote').textContent=MODEL.provider+' · '+MODEL.note;
  $('mname').textContent=MODEL.name;
  $('steps').max=MODEL.step_max||50; $('steps').value=MODEL.default_steps||28; $('stepsv').textContent=$('steps').value+' / '+$('steps').max;
  const sizes=MODEL.sizes||['1:1']; if(!sizes.includes(SIZE))SIZE=sizes[0];
  $('sizes').innerHTML=sizes.map(s=>`<div class="chip ${s===SIZE?'on':''}" data-s="${s}">${s}</div>`).join('');
  $('sizes').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{SIZE=c.dataset.s;pickModel(MODEL.id);});
  renderRefSection();
  updateCost();
}
function renderRefSection(){
  const cap=MODEL.img||'none', on=cap!=='none', badge=$('refbadge');
  $('refpaste').style.display=on?'flex':'none';
  $('refhint').style.display=on?'block':'none';
  badge.style.display=on?'inline-block':'none';
  if(!on){
    REF=null;
    $('refzone').innerHTML=`<div class="textonly"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" style="flex:none"><rect x="3" y="5" width="18" height="14"></rect><path d="M3 16l5-4 4 3"></path><line x1="4" y1="4" x2="20" y2="20"></line></svg><span>${MODEL.name} is text-to-image only — no reference input.</span></div>`;
    return;
  }
  badge.textContent=cap==='required'?'REQUIRED':(cap==='style'?'STYLE REF':'OPTIONAL');
  badge.className='refbadge'+(cap==='required'?' req':'');
  $('refhint').textContent=cap==='required'?'This model requires a reference image.'
    :(cap==='style'?'Used as a style reference.':'Optional img-to-img guidance.');
  renderRef();
}
function renderRef(){
  const cap=MODEL.img||'none', z=$('refzone');
  if(REF&&REF.loading){z.innerHTML='<div class="drop"><div class="spin"><div></div></div></div>';return;}
  if(REF){
    z.innerHTML=`<div class="drop">${REF.preview?`<img src="${REF.preview}">`:`<div class="ph mono">${REF.label}</div>`}<div class="clr" id="refclr">×</div>${REF.preview?`<div class="meta">${REF.label}</div>`:''}</div>`;
    $('refclr').onclick=e=>{e.stopPropagation();REF=null;renderRef();};
  } else {
    z.innerHTML=`<div class="drop${cap==='required'?' req':''}"><div class="ph">${cap==='required'?'Required — drop or paste a reference':'Drop, click, or paste below…'}</div></div>`;
  }
  const d=z.querySelector('.drop'); if(!d)return;
  d.onclick=()=>{if(!REF)$('reffile').click();};
  d.ondragover=e=>{e.preventDefault();d.classList.add('over');const p=d.querySelector('.ph');if(p&&!REF)p.textContent='Drop image to upload';};
  d.ondragleave=()=>{d.classList.remove('over');const p=d.querySelector('.ph');if(p&&!REF)p.textContent=(cap==='required'?'Required — drop or paste a reference':'Drop, click, or paste below…');};
  d.ondrop=e=>{e.preventDefault();d.classList.remove('over');const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)refFromFile(f);};
}
function refFromFile(f){
  const rd=new FileReader();
  rd.onload=async()=>{
    const dataUri=rd.result;
    REF={loading:true}; renderRef();
    try{
      const r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:dataUri})});
      const j=await r.json();
      REF=(r.ok&&j.uuid)?{val:j.uuid,preview:dataUri,label:'UUID '+j.uuid}
                        :{val:dataUri,preview:dataUri,label:f.name+' (local)'};
    }catch(e){ REF={val:dataUri,preview:dataUri,label:f.name+' (local)'}; }
    renderRef();
  };
  rd.readAsDataURL(f);
}
function addRefFromInput(){
  const v=$('refurl').value.trim(); if(!v)return;
  const isImgSrc=v.startsWith('http')||v.startsWith('data:');
  REF={val:v,preview:isImgSrc?v:'',label:v.length>60?v.slice(0,57)+'…':v};
  $('refurl').value=''; renderRef();
}
function updateCost(){
  const n=+$('num').value;
  if(MODEL.id==='catalog'){
    $('cost').textContent=`${n} image${n>1?'s':''} · catalog model — real cost returns per render`;
    $('mcost').textContent='catalog'; $('topcost').textContent='—';
  } else if(MODEL.free){
    $('cost').textContent=`${n} image${n>1?'s':''} · free`; $('mcost').textContent='free'; $('topcost').textContent='$0.00';
  } else {
    const per=MODEL.price||0, tot=per*n;
    $('cost').textContent=`≈ $${tot.toFixed(3)} · ${n} × $${per} · Runware`; $('mcost').textContent='$'+tot.toFixed(3); $('topcost').textContent='$'+tot.toFixed(2);
  }
}
async function refreshBalance(){
  try{const j=await (await fetch('/api/balance')).json();
    if(j.balance!=null)$('balance').textContent='BAL $'+(+j.balance).toFixed(3);
  }catch(e){}
}
let _cq;
function wireCatalog(){
  $('catq').oninput=()=>{clearTimeout(_cq);_cq=setTimeout(searchCatalog,350);};
}
async function searchCatalog(){
  const q=$('catq').value.trim();
  if(!q){$('catres').innerHTML='';return;}
  const res=await (await fetch('/api/catalog?q='+encodeURIComponent(q))).json();
  $('catres').innerHTML=(res||[]).map((m,i)=>
    `<div class="cfg" data-c="${i}" style="cursor:pointer"><div class="t"><b>${m.name}</b><div>${m.air} · ${m.category||''}${m.img==='optional'?' · img2img':''}</div></div></div>`).join('')||'<div class="mono" style="font-size:9px;color:var(--faint);padding:6px 0">no matches</div>';
  $('catres').querySelectorAll('[data-c]').forEach(el=>el.onclick=()=>pickCatalog(res[+el.dataset.c]));
}
function pickCatalog(m){
  MODEL={id:'catalog',air:m.air,name:m.name,provider:'Runware catalog',img:m.img,imgMax:1,
         sizes:['1:1','16:9','9:16','3:2','2:3'],step_max:50,default_steps:28,price:0,note:m.comment||''};
  $('modelnote').textContent='CATALOG · '+m.air+(m.comment?' · '+m.comment:'');
  $('mname').textContent=m.name;
  $('steps').max=50;$('steps').value=28;$('stepsv').textContent='28 / 50';
  const sizes=MODEL.sizes; if(!sizes.includes(SIZE))SIZE=sizes[0];
  $('sizes').innerHTML=sizes.map(s=>`<div class="chip ${s===SIZE?'on':''}" data-s="${s}">${s}</div>`).join('');
  $('sizes').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{SIZE=c.dataset.s;
    $('sizes').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.s===SIZE));});
  renderRefSection(); updateCost();
}
function wire(){
  $('negon').onchange=e=>$('negative').style.display=e.target.checked?'block':'none';
  $('steps').oninput=e=>$('stepsv').textContent=e.target.value+' / '+$('steps').max;
  $('num').oninput=e=>{$('numv').textContent=e.target.value;updateCost();};
  $('numv').textContent=$('num').value;
  $('gen').onclick=generate; $('save').onclick=saveConfig;
  $('refadd').onclick=addRefFromInput;
  $('refurl').onkeydown=e=>{if(e.key==='Enter')addRefFromInput();};
  $('reffile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)refFromFile(f);e.target.value='';};
}
async function generate(){
  const btn=$('gen'); if(btn.disabled)return;
  const [w,h]=DIMS[SIZE]||[1024,1024];
  const n=+$('num').value;
  if((MODEL.img||'none')==='required'&&!(REF&&REF.val)){$('err').innerHTML='<div class="err">'+MODEL.name+' requires a reference image.</div>';return;}
  const body={model:MODEL.id,prompt:$('prompt').value,negative:$('negon').checked?$('negative').value:'',width:w,height:h,steps:+$('steps').value,n,refs:(REF&&REF.val&&(MODEL.img||'none')!=='none')?[REF.val]:[]};
  if(MODEL.id==='catalog'){body.air=MODEL.air;body.model_name=MODEL.name;body.img=MODEL.img;}
  btn.disabled=true; btn.textContent='Rendering…'; $('err').innerHTML=''; $('status').textContent='RENDERING '+n+' · '+MODEL.name.toUpperCase();
  // placeholders
  RESULTS = Array.from({length:n},(_,i)=>({loading:true,id:'ph'+i,w:w,h:h})).concat(RESULTS); renderGrid();
  try{
    const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    RESULTS=RESULTS.filter(x=>!x.loading);
    if(!r.ok){ $('err').innerHTML='<div class="err">'+(j.error||'failed')+(j.detail?'\n'+j.detail.join('\n'):'')+'</div>'; }
    else { RESULTS=(j.results||[]).concat(RESULTS); if(j.errors&&j.errors.length)$('err').innerHTML='<div class="err">'+j.errors.length+' of '+n+' failed:\n'+j.errors[0]+'</div>'; }
  }catch(e){ RESULTS=RESULTS.filter(x=>!x.loading); $('err').innerHTML='<div class="err">'+e+'</div>'; }
  renderGrid(); btn.disabled=false; btn.textContent='Generate ↵'; $('status').textContent=''; refreshBalance();
}
function colCount(){
  const w=$('grid').clientWidth||window.innerWidth;
  return w>1250?4:(w>850?3:2);
}
let SELECTED=new Set(), META=localStorage.getItem('ud_meta')==='1';
function toggleMeta(){
  META=!META; localStorage.setItem('ud_meta',META?'1':'0');
  $('metaToggle').classList.toggle('on',META);
  renderGrid(); if(VIEW==='gallery')renderGallery();
}
function tileHtml(r,kind,i){
  const sel=SELECTED.has(r.id)?' selected':'';
  const meta=META?`<div class="meta"><span>${r.author&&r.author!=='operator'?'@'+r.author+' · ':''}${r.model_name||''}</span><span>${(r.width||r.w||'?')}×${(r.height||r.h||'?')} · ${r.cost>0?'$'+r.cost:'free'}</span></div>`:'';
  return `<div class="cell"><div class="tile${sel}" data-${kind}="${i}">
    <div class="selbox" data-selid="${r.id}">${SELECTED.has(r.id)?'✓':''}</div>
    <div class="acts">
      <div class="abtn" title="Reuse as prompt" data-reuse="${i}">⟲</div>
      <div class="abtn" title="Download" data-dl="${r.url}">⇩</div>
    </div>
    <img src="${r.url}"${kind==='g'?' loading="lazy"':''}></div>${meta}</div>`;
}
function wireTiles(el,items,openFn){
  el.querySelectorAll('.selbox').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); const id=b.dataset.selid;
    SELECTED.has(id)?SELECTED.delete(id):SELECTED.add(id);
    updateSelbar(); renderGrid(); if(VIEW==='gallery')renderGallery();
  });
  el.querySelectorAll('[data-reuse]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); reuseRec(items[+b.dataset.reuse]);
  });
  el.querySelectorAll('[data-dl]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); const a=document.createElement('a');a.href=b.dataset.dl;a.download='';document.body.appendChild(a);a.click();a.remove();
  });
  el.querySelectorAll('.tile[data-i],.tile[data-g]').forEach(t=>t.onclick=()=>openFn(+(t.dataset.i??t.dataset.g)));
}
function reuseRec(r){
  if(!r)return;
  $('prompt').value=r.prompt||'';
  if(MODELS.find(m=>m.id===r.model)){$('model').value=r.model;pickModel(r.model);}
  $('modalRoot').innerHTML=''; setView('session');
}
function updateSelbar(){
  $('selbar').style.display=SELECTED.size?'flex':'none';
  $('selcount').textContent=SELECTED.size+' SELECTED';
  const d=$('seldel'); if(d){d.dataset.armed='';d.textContent='DELETE';}
}
function selRecs(){
  const seen=new Set(), out=[];
  [...RESULTS,...GITEMS].forEach(r=>{if(r.id&&SELECTED.has(r.id)&&!seen.has(r.id)){seen.add(r.id);out.push(r);}});
  return out;
}
function selDownload(){
  selRecs().forEach((r,k)=>setTimeout(()=>{const a=document.createElement('a');a.href=r.url;a.download='';document.body.appendChild(a);a.click();a.remove();},k*250));
}
async function selDelete(){
  const d=$('seldel');
  if(d.dataset.armed!=='1'){d.dataset.armed='1';d.textContent='CONFIRM DELETE '+SELECTED.size+'?';setTimeout(()=>{if(d.dataset.armed==='1'){d.dataset.armed='';d.textContent='DELETE';}},4000);return;}
  for(const r of selRecs()){await fetch('/api/image/'+encodeURIComponent(r.id),{method:'DELETE'});}
  RESULTS=RESULTS.filter(x=>!SELECTED.has(x.id)); SELECTED.clear(); updateSelbar();
  renderGrid(); if(VIEW==='gallery')refreshGallery();
}
function selClear(){SELECTED.clear();updateSelbar();renderGrid();if(VIEW==='gallery')renderGallery();}
function renderGrid(){
  // true masonry: newest packs left-to-right into the currently-shortest column,
  // heights predicted from each record's known render ratio (no DOM measuring).
  const n=colCount();
  const cols=Array.from({length:n},()=>({html:'',h:0}));
  RESULTS.forEach((r,i)=>{
    const ratio=(r.h&&r.w)?(r.h/r.w):1;
    let best=0; for(let c=1;c<n;c++) if(cols[c].h<cols[best].h) best=c;
    if(r.loading){
      cols[best].html+=`<div class="cell"><div class="tile ph" style="padding-bottom:${100*ratio}%"><div class="spin"><div></div></div></div></div>`;
    } else {
      cols[best].html+=tileHtml(r,'i',i);
    }
    cols[best].h+=ratio;
  });
  $('grid').innerHTML=cols.map(c=>`<div class="col">${c.html}</div>`).join('');
  wireTiles($('grid'),RESULTS,openDetail);
}
let _rsz; window.addEventListener('resize',()=>{clearTimeout(_rsz);_rsz=setTimeout(()=>{renderGrid();if(VIEW==='gallery')renderGallery();},150);});

// ---- gallery view: full-history masonry + search + tags + detail drawer ----
let VIEW='session', GITEMS=[], GTAGS=new Set(), GAUTHOR='', DRAWER_ID=null; let _gq;
function setView(v){
  VIEW=v;
  document.querySelector('.wrap').style.display=(v==='session')?'flex':'none';
  $('galleryView').style.display=(v==='gallery')?'block':'none';
  $('tabSession').classList.toggle('on',v==='session');
  $('tabGallery').classList.toggle('on',v==='gallery');
  if(v==='gallery')refreshGallery();
}
async function refreshGallery(){
  const p=new URLSearchParams({all:'1'});
  if($('gq').value.trim())p.set('q',$('gq').value.trim());
  if(GTAGS.size)p.set('tag',[...GTAGS].join(','));
  if(GAUTHOR)p.set('author',GAUTHOR);
  GITEMS=await (await fetch('/api/session?'+p)).json();
  $('gcount').textContent=GITEMS.length+' IMAGES';
  renderAuthorChips(); renderTagChips(); renderGallery();
  if(DRAWER_ID)openDrawerById(DRAWER_ID);
}
async function renderAuthorChips(){
  const authors=await (await fetch('/api/authors')).json();
  $('gauthors').innerHTML=authors.map(([a,c])=>
    `<span class="tagchip ${GAUTHOR===a?'on':''}" data-a="${a}">@${a} · ${c}</span>`).join('');
  $('gauthors').querySelectorAll('.tagchip').forEach(ch=>ch.onclick=()=>{GAUTHOR=(GAUTHOR===ch.dataset.a)?'':ch.dataset.a;refreshGallery();});
}
async function renderTagChips(){
  const vocab=await (await fetch('/api/tags')).json();
  $('gchips').innerHTML=vocab.map(([t,c])=>
    `<span class="tagchip ${GTAGS.has(t)?'on':''}" data-t="${t}">${t} · ${c}</span>`).join('')||'<span class="mono" style="font-size:9px;color:var(--faint)">no tags yet — open an image and add some</span>';
  $('gchips').querySelectorAll('.tagchip').forEach(ch=>ch.onclick=()=>{
    GTAGS.has(ch.dataset.t)?GTAGS.delete(ch.dataset.t):GTAGS.add(ch.dataset.t);
    refreshGallery();});
}
function renderGallery(){
  const gEl=$('ggrid');
  const w=gEl.clientWidth||window.innerWidth; const n=w>1250?4:(w>850?3:2);
  const cols=Array.from({length:n},()=>({html:'',h:0}));
  GITEMS.forEach((r,i)=>{
    const ratio=(r.h&&r.w)?(r.h/r.w):((r.height&&r.width)?(r.height/r.width):1);
    let best=0; for(let c=1;c<n;c++) if(cols[c].h<cols[best].h) best=c;
    let cell=tileHtml(r,'g',i);
    if(r.id===DRAWER_ID)cell=cell.replace('class="tile','style="outline:2px solid var(--accent);outline-offset:-2px" class="tile');
    cols[best].html+=cell;
    cols[best].h+=ratio;
  });
  gEl.innerHTML=cols.map(c=>`<div class="col">${c.html}</div>`).join('');
  wireTiles(gEl,GITEMS,openDrawer);
}
function tagsEditorHtml(r,scope){
  const tags=(r.tags||[]);
  return `<div class="lbl" style="margin:12px 0 6px">Tags</div>
    <div id="${scope}tags">${tags.map(t=>`<span class="tagchip" data-rm="${t}">${t} <span class="x">×</span></span>`).join('')}
    <input class="tagadd" id="${scope}tagin" placeholder="+ tag"></div>`;
}
function wireTagsEditor(r,scope,after){
  const box=$(scope+'tags'); if(!box)return;
  box.querySelectorAll('[data-rm]').forEach(ch=>ch.onclick=async()=>{
    const t=(r.tags||[]).filter(x=>x!==ch.dataset.rm); await saveTags(r,t); after();});
  const inp=$(scope+'tagin');
  inp.onkeydown=async e=>{
    if(e.key==='Enter'&&inp.value.trim()){
      const t=[...new Set([...(r.tags||[]),inp.value.trim()])]; await saveTags(r,t); after();}
  };
}
async function saveTags(r,tags){
  const resp=await fetch('/api/image/'+encodeURIComponent(r.id)+'/tags',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({tags})});
  if(resp.ok){r.tags=tags;
    const s=RESULTS.find(x=>x.id===r.id); if(s)s.tags=tags;
    const g=GITEMS.find(x=>x.id===r.id); if(g)g.tags=tags;}
}
function openDrawer(i){openDrawerById(GITEMS[i]&&GITEMS[i].id);}
function openDrawerById(id){
  const r=GITEMS.find(x=>x.id===id); const d=$('drawer');
  if(!r){d.style.display='none';DRAWER_ID=null;renderGallery();return;}
  DRAWER_ID=id;
  const rows=[['AUTHOR',r.author||'operator'],['SEED',r.seed],['STEPS',r.steps],['SIZE',(r.width||r.w)+'×'+(r.height||r.h)],['MODEL',r.model_name],['COST',r.cost>0?'$'+r.cost:'free']];
  if(r.ref)rows.push(['SEED IMG',String(r.ref).slice(0,32)+'…']);
  d.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span class="mono" style="font-size:9px;letter-spacing:.12em;color:var(--muted)">IMAGE DETAIL</span>
      <span class="x" style="cursor:pointer;font-size:16px" onclick="openDrawerById(null)">×</span></div>
    <img src="${r.url}" style="width:100%;border:1px solid var(--line)">
    <div style="font-weight:700;font-size:13px;margin-top:10px">${r.model_name||''}</div>
    <div style="font-size:11px;line-height:1.5;color:var(--muted);margin-top:6px">${r.prompt||''}</div>
    ${tagsEditorHtml(r,'d')}
    <div style="margin-top:10px">${rows.map(x=>`<div class="drow"><span>${x[0]}</span><span class="mono">${x[1]}</span></div>`).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <a class="btn gen" style="flex:1;text-decoration:none;line-height:1.9;text-align:center" href="${r.url}" download>Download</a>
    </div>
    <button class="btn ghost" id="gdelbtn" style="width:100%;margin-top:8px;color:var(--accentLite)">Delete</button>`;
  d.style.display='block';
  wireTagsEditor(r,'d',()=>openDrawerById(id));
  const b=$('gdelbtn');
  b.onclick=async()=>{
    if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Confirm delete?';b.style.borderColor='var(--accent)';setTimeout(()=>{if(b.dataset.armed==='1'){b.dataset.armed='';b.textContent='Delete';b.style.borderColor='var(--line)';}},4000);return;}
    const resp=await fetch('/api/image/'+encodeURIComponent(r.id),{method:'DELETE'});
    if(resp.ok){DRAWER_ID=null;$('drawer').style.display='none';RESULTS=RESULTS.filter(x=>x.id!==r.id);renderGrid();refreshGallery();}
  };
  renderGallery();
}
(function(){const g=$('gq'); if(g)g.oninput=()=>{clearTimeout(_gq);_gq=setTimeout(refreshGallery,300);};
  $('metaToggle').classList.toggle('on',META);})();
function openDetail(i){
  const r=RESULTS[i]; if(!r||r.loading)return;
  const rows=[['AUTHOR',r.author||'operator'],['SEED',r.seed],['STEPS',r.steps],['SIZE',r.width+'×'+r.height],['MODEL',r.model_name],['PROVIDER',r.provider],['COST',r.cost>0?'$'+r.cost:'free']];
  if(r.ref)rows.push(['SEED IMG',r.ref.length>44?r.ref.slice(0,41)+'…':r.ref]);
  $('modalRoot').innerHTML=`<div class="modal" id="mm"><div class="card" onclick="event.stopPropagation()">
    <img src="${r.url}">
    <div class="body">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span class="mono" style="font-size:9px;letter-spacing:.12em;color:var(--muted)">IMAGE DETAIL</span>
        <span class="x" onclick="$('modalRoot').innerHTML=''" style="font-size:17px">×</span></div>
      <div style="font-weight:700;font-size:15px">${r.model_name}</div>
      <div class="lbl" style="margin:14px 0 4px">Prompt</div>
      <div style="font-size:12px;line-height:1.55">${r.prompt||''}</div>
      ${r.negative?'<div class="lbl" style="margin:12px 0 4px">Negative</div><div style="font-size:12px;color:var(--muted)">'+r.negative+'</div>':''}
      ${tagsEditorHtml(r,'m')}
      <div style="margin-top:12px">${rows.map(x=>`<div class="drow"><span>${x[0]}</span><span class="mono">${x[1]}</span></div>`).join('')}</div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn ghost" style="flex:1" onclick="reuse(${i})">Reuse settings</button>
        <a class="btn gen" style="flex:1;text-decoration:none;line-height:1.9" href="${r.url}" download>Download</a>
      </div>
      <button class="btn ghost" id="delbtn" style="width:100%;margin-top:8px;color:var(--accentLite);border-color:var(--line)" onclick="armDelete(${i})">Delete</button>
    </div></div></div>`;
  $('mm').onclick=()=>$('modalRoot').innerHTML='';
  wireTagsEditor(r,'m',()=>openDetail(i));
}
function reuse(i){const r=RESULTS[i];$('prompt').value=r.prompt||'';const sel=$('model');if(MODELS.find(m=>m.id===r.model)){sel.value=r.model;pickModel(r.model);}$('modalRoot').innerHTML='';}
function armDelete(i){
  const b=$('delbtn'); if(!b)return;
  if(b.dataset.armed!=='1'){ b.dataset.armed='1'; b.textContent='Confirm delete?'; b.style.borderColor='var(--accent)'; b.style.background='rgba(184,20,20,.15)';
    setTimeout(()=>{const x=$('delbtn'); if(x&&x.dataset.armed==='1'){x.dataset.armed='';x.textContent='Delete';x.style.borderColor='var(--line)';x.style.background='';}},4000);
    return; }
  doDelete(i);
}
async function doDelete(i){
  const r=RESULTS[i]; if(!r)return;
  const b=$('delbtn'); if(b){b.disabled=true;b.textContent='Deleting…';}
  try{
    const resp=await fetch('/api/image/'+encodeURIComponent(r.id),{method:'DELETE'});
    if(resp.ok){ RESULTS.splice(i,1); $('modalRoot').innerHTML=''; renderGrid(); }
    else{ const j=await resp.json(); if(b){b.disabled=false;b.textContent='Delete failed: '+(j.error||resp.status);} }
  }catch(e){ if(b){b.disabled=false;b.textContent='Delete failed';} }
}
async function saveConfig(){
  const cfg={id:'cfg'+Date.now(),title:($('prompt').value||'Untitled').split(/[,.]/)[0].slice(0,30).trim()||'Untitled',
    model:MODEL.id,model_name:MODEL.name,size:SIZE,steps:+$('steps').value,num:+$('num').value,
    prompt:$('prompt').value,negative:$('negon').checked?$('negative').value:''};
  CONFIGS=[cfg].concat(CONFIGS); await fetch('/api/configs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(CONFIGS)});
  const b=$('save'); b.textContent='Saved ✓'; setTimeout(()=>b.textContent='Save',1300); renderConfigs();
}
function renderConfigs(){
  $('cfgwrap').style.display=CONFIGS.length?'block':'none';
  $('cfgs').innerHTML=CONFIGS.map((c,i)=>`<div class="cfg"><div class="t" data-l="${i}"><b>${c.title}</b><div>${c.model_name} · ${c.size}</div></div><div class="x" data-d="${i}">×</div></div>`).join('');
  $('cfgs').querySelectorAll('[data-l]').forEach(e=>e.onclick=()=>loadConfig(+e.dataset.l));
  $('cfgs').querySelectorAll('[data-d]').forEach(e=>e.onclick=()=>delConfig(+e.dataset.d));
}
function loadConfig(i){const c=CONFIGS[i];$('prompt').value=c.prompt||'';$('negative').value=c.negative||'';$('negon').checked=!!c.negative;$('negative').style.display=c.negative?'block':'none';
  if(MODELS.find(m=>m.id===c.model)){$('model').value=c.model;SIZE=c.size;pickModel(c.model);}$('steps').value=c.steps;$('stepsv').textContent=c.steps+' / '+$('steps').max;$('num').value=c.num;$('numv').textContent=c.num;updateCost();}
async function delConfig(i){CONFIGS.splice(i,1);await fetch('/api/configs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(CONFIGS)});renderConfigs();}
boot();
</script>
